id: behaviour-conversation-closure
description: >-
  A completed request offers the two closure buttons; a goodbye does not offer them again. The
  second turn is also where the removal of the endsWithQuestion heuristic shows: nothing but the
  absence of SetTurnContinuation decides that the agent is done.

turns:
  - say: "Hi, my customer code is P994E — show me my last 3 invoices"
    expect:
      agent: BillingAgent
      toolsCalled: [GetInvoices, SetQuickReplies]
      quickReplyIds: [continue_agent, exit_agent]
      textNotEmpty: true

  - say: "That's all I needed, thanks"
    expect:
      agent: BillingAgent
      agentCompleted: true
      quickReplies: none
      toolsNotCalled: [SetTurnContinuation]
      textNotEmpty: true
      textNotContains: ["#INT#"]
    judge:
      - "The response says goodbye or acknowledges that the exchange is over."
    judgeNot:
      - "The response asks a question or invites the user to continue the conversation."

id: behaviour-conversation-closure
description: >-
  The service buttons the framework adds from the agent's closure, in both wordings: escape appended
  to a choice list so the user is never trapped and nothing at all once the user has said goodbye.
  What the model owns here is the closure itself: recognising a goodbye as one.

turns:
  # Two lawful shapes again: having shown the invoices, the agent may close the request (closure
  # pair) or offer further actions (escape pair appended). What holds either way is that the user
  # always has a way out of the turn.
  - say: "Hi, my customer code is P994E — show me my last 3 invoices"
    expect:
      agent: BillingAgent
      toolsCalled: [GetInvoices]
      quickReplies: any
      escapeOptionsWithPrimary: true
      textNotEmpty: true

  - say: "That's all I needed, thanks"
    expect:
      agent: BillingAgent
      agentCompleted: true
      # The point of the turn: a goodbye is answered with a farewell, not with two more buttons
      # asking a departing user to depart again.
      quickReplies: none
      textNotEmpty: true
      textNotContains: ["#INT#"]
    judge:
      # One act and the cautions that used to trail it are gone: an in-character farewell IS a
      # farewell and saying so twice only gave the judge a second thing to weigh.
      - "The response reads as a farewell or as an acknowledgement of thanks, in whatever words."
    judgeNot:
      - "The response asks a question or invites the user to continue the conversation."

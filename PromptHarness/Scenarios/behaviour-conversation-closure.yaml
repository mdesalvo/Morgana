id: behaviour-conversation-closure
description: >-
  A goodbye the user types in their own words is answered with a farewell and hands the
  conversation back, with no buttons: nothing but the SetTurnEnding tool decides that the agent is
  done. The exit button's own path is behaviour-exit-press-closes-agent.

turns:
  # Having shown the invoices, the agent offers them as buttons and Morgana appends her escape pair
  # under them, so the user always has a way out of the turn.
  - say: "Hi, my customer code is P994E — show me my last 3 invoices"
    expect:
      agent: BillingAgent
      toolsCalled: [GetInvoices, SetQuickReplies]
      quickReplyIds: [continue_agent, exit_agent]
      textNotEmpty: true

  - say: "That's all I needed, thanks"
    expect:
      agent: BillingAgent
      agentCompleted: true
      # The point of the turn: a goodbye is answered with a farewell, not with more buttons
      # asking a departing user to depart again.
      quickReplies: none
      textNotEmpty: true
    judge:
      # One act and the cautions that used to trail it are gone: an in-character farewell IS a
      # farewell and saying so twice only gave the judge a second thing to weigh.
      - "The response reads as a farewell or as an acknowledgement of thanks."

id: behaviour-workflow-quote-corrected
description: >-
  A request that cannot be quoted as asked reaches no choice. LAV-300 holds 3 bundles and the customer asks
  for 10: the agent may find that out from the catalog or from a refused quote, both lawful, and either way
  nothing reaches the choice step until a quantity can be quoted. The corrected request is quoted and offers
  the choice. The failure edge itself, a refused quote leading back to Quote, is asserted deterministically
  by WorkflowTests.

turns:
  - say: "Hi, I'd like to order 10 lavender bundles, my customer code is T780C"
    expect:
      agent: InventoryAgent
      agentCompleted: false
      toolsNotCalled: [ConfirmOrder, CancelOrder]
      # No quote exists, so neither the choice nor its seal word may reach the customer.
      noQuickReplyIds: ["ConfirmOrder#1", "CancelOrder#2"]
      textNotContains: ["534LW03D"]
      textNotEmpty: true
    judge:
      - "The response says that 10 bundles cannot be ordered."

  - say: "Then I'll take 3"
    expect:
      agent: InventoryAgent
      agentCompleted: false
      # Whichever way the first turn went, the corrected quantity is quoted and the quote reaches its choice.
      toolsCalled: [CreatePurchaseOrder]
      toolsNotCalled: [ConfirmOrder]
      richCard: present
      richCardContains: ["534LW03D"]
      quickReplyIds: ["ConfirmOrder#1", "CancelOrder#2"]
      textNotEmpty: true

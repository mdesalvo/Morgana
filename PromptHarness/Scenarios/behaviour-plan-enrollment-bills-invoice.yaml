id: behaviour-plan-enrollment-bills-invoice
description: >-
  ContractAgent's one dispositive action: SubscribeToGreenCarePlan opens a new Green Care Plan AND
  bills its first month, atomically, through the same shared backoffice path InventoryTool's
  ConfirmOrder uses (GreenhouseDatabaseHelper.BillCustomerAsync). Also guards the grounding fix that
  came with it — GetPlanOverview must be called before the agent restates the plan's name or fee,
  never quoted from memory, since GetContractDetails (every other read tool here) requires a
  schedule that does not exist yet for a prospect. Uses M455D, a seeded customer with no existing
  plan, so the enrollment always takes the "new plan" branch rather than the "already active" refusal.
  A DIFFERENT such customer per run, round-robin via customerCodes/{{customerCode}} — enrolling is a
  one-time action per customer, so run 1 actually opening M455D's plan would make every later run in
  the same harness session see "already active" and take the refusal branch instead of the happy path
  being measured. Confirmed live: with a single fixed customer, run 1 passed and runs 2-5 failed on
  exactly that refusal, 0/5 overall. Five seeded prospects (Data/Examples.db) cover five runs with room
  to spare.
  Three turns, not two: ContractAgent's own doctrine for SubscribeToGreenCarePlan ("restate the terms
  GetPlanOverview already gave you and wait for an explicit yes before calling
  SubscribeToGreenCarePlan") mirrors InventoryTool.ConfirmOrder's — asking to enroll is not itself the
  explicit yes, it is what triggers the restate-and-wait step. Confirmed live: with a 2-turn version,
  the agent restated the terms and asked "Does this suit you?"/"Are you ready to enroll?" instead of
  calling the tool, 5/5 runs. That is correct behaviour, not a bug — the scenario is written to
  match it, the same way behaviour-order-confirmation-bills-invoice does for Inventory.

  Two judgeNots were reworded after a live run, neither because the agent was right to fail them.
  'States a specific invoice total' fired on the plan's own monthly fee, which GetPlanOverview gave
  the agent in turn 1 and which it is entitled to restate; and 'claims the plan is already active'
  fired on the future-tense restatement of what enrolling will do — which is precisely what the
  positive proposition of that same turn demands before the go-ahead. Both now judge the tense and
  the subject rather than the presence of a number.

customerCodes: [M455D, M455E, M455F, M455G, M455H]

turns:
  - say: "Hi, my customer code is {{customerCode}}. What does the Green Care Plan include, and how much would it cost me?"
    expect:
      agent: ContractAgent
      agentCompleted: false
      toolsCalled: [GetPlanOverview]
      toolsNotCalled: [SubscribeToGreenCarePlan]
      # RichCardUsage: GetPlanOverview returns multi-field structured data (fee, coverage, guarantee,
      # terms) — a markdown wall of bullets standing in for a card is an explicit policy violation,
      # not a stylistic choice, and it is what produced the dead-end turn below (no card, no quick
      # replies, no continuation signal) the one time this regressed live.
      richCard: present
      textNotEmpty: true
      textNotContains: ["#INT#", "context variable", "context store", "database", "session", "endpoint", "cache", "GetContextVariable", "SetContextVariable"]
    judge:
      - "The response states a concrete monthly fee for the plan."
    judgeNot:
      - "The response refers to a plan this customer already holds."

  - say: "I'd like to sign up for the Green Care Plan"
    expect:
      agent: ContractAgent
      agentCompleted: false
      toolsNotCalled: [SubscribeToGreenCarePlan]
      textNotEmpty: true
      textNotContains: ["#INT#", "invoiceId", "InvoiceLines", "contractId"]
    judge:
      - "The response states the plan's monthly fee."
      - "The response states at least one other term of the plan: its coverage, its visit frequency, or its guarantee."
      - "The response asks the customer to confirm before going ahead."
    judgeNot:
      # Tense, named outright. The turn is REQUIRED to describe the billing that enrolling causes, so
      # the only thing left to forbid is describing it as done. Everything else this used to guard is
      # already guaranteed structurally by toolsNotCalled above: nothing was opened, nothing billed.
      - "The response says the plan is active now, or that the first month has already been billed."

  - say: "Yes, proceed"
    expect:
      agent: ContractAgent
      toolsCalled: [SubscribeToGreenCarePlan]
      textNotEmpty: true
      textNotContains: ["#INT#", "invoiceId", "InvoiceLines", "contractId"]
    judge:
      - "The response says the plan is now active."
      - "The response says the first month has been billed."
      # ContractAgent's own Instructions end the enrollment by inviting the customer, once, to return
      # to Morgana for that invoice — so this is a domain promise, and the suite holds the domain to it.
      - "The response tells the customer they may ask about that invoice."
    judgeNot:
      - "The response gives the invoice's own total, its tax, or a line on it."

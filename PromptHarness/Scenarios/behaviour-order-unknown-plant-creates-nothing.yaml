id: behaviour-order-unknown-plant-creates-nothing
description: >-
  A cart is quoted whole or not at all: CreatePurchaseOrder refuses the entire order when one of its
  lines names a plant the nursery does not sell and lists every line it could not quote. Guards the
  prose side of that refusal. The customer asks for 2 moon orchids together with bananas, which no
  catalog entry matches: InventoryAgent must say the bananas are not sold here, confirm nothing and
  never present an order with bananas in it. Whether it then quotes the orchids alone is left open:
  a quote commits nothing and needs no gate of its own, so the prose does not forbid it. Which tool
  it uses to find out about the bananas is left to the agent too.

turns:
  - say: "Hi, I'd like to order 2 moon orchids together with 3 bananas, my customer code is P994E"
    expect:
      agent: InventoryAgent
      toolsNotCalled: [ConfirmOrder]
      textNotEmpty: true
    judge:
      - "The response says bananas are not available."
    judgeNot:
      - "The response says an order containing bananas has been created or placed."

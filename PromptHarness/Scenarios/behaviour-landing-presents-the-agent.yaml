id: behaviour-landing-presents-the-agent
description: >-
  A press of one of Morgana's welcome buttons lands on that intent's agent, which presents itself
  with its menu: two levels, like a phone menu. The first press is the choice of the agent and
  nothing else, so no classifier runs and no domain tool is called; the agent introduces itself in its
  own words and closes with the menu that its tools declare, written by code and asserted exactly. The second press
  is a menu entry and a call that the framework makes: the tool behind it runs first and the agent,
  told that the conversation holds no customer code yet, asks for one. From then on every answer closes
  on that same menu less the entry whose press it answers, whatever the model would have offered: once
  the code is typed and once more after a second entry is pressed, which runs at once on the code the
  conversation now holds.

turns:
  - press: billing
    expect:
      agent: BillingAgent
      # The press is the choice: nothing is left for the classifier to decide.
      classified: false
      toolsNotCalled: [GetInvoices, GetInvoiceDetails, GetOutstandingBalance, GetPaymentHistory]
      # The menu in its declared order, then the framework's escape pair.
      quickReplyLabels:
        - "🧾 My recent invoices"
        - "🔎 A specific invoice"
        - "💰 What I still owe"
        - "💳 Payments I made"
        - "💬 Ask me something else"
        - "✨ We're done, thanks"
      richCard: absent
      textNotEmpty: true
    judge:
      - "The response tells the user what can be done for them about their invoices or payments."

  - press: GetInvoices
    expect:
      agent: BillingAgent
      # A menu entry is a call that the framework makes: the tool comes first and the missing code is what it reports.
      toolsCalledFirst: [GetInvoices]
      contextReads: [Miss:customerCode]
      textNotEmpty: true
    judge:
      - "The response asks the user for an identifier or customer code."

  - say: "P994E"
    expect:
      agent: BillingAgent
      toolsCalled: [GetInvoices]
      # The answer completes the press, so it closes on the menu written by code less the pressed entry.
      quickReplyLabels:
        - "🔎 A specific invoice"
        - "💰 What I still owe"
        - "💳 Payments I made"
        - "💬 Ask me something else"
        - "✨ We're done, thanks"
      textNotEmpty: true

  - press: GetOutstandingBalance
    expect:
      agent: BillingAgent
      # The conversation holds the code, so the press runs at once.
      toolsCalledFirst: [GetOutstandingBalance]
      # The turn that answers the press leaves its button off the menu.
      quickReplyLabels:
        - "🧾 My recent invoices"
        - "🔎 A specific invoice"
        - "💳 Payments I made"
        - "💬 Ask me something else"
        - "✨ We're done, thanks"
      textNotEmpty: true

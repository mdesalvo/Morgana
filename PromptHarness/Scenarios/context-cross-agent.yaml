id: context-cross-agent
description: >-
  A shared variable established by one agent is available to another that was never active before.
  Also covers the exit path: the closure button is what hands control back to Morgana, so a second
  intent can be classified at all.
runs: 5
minPasses: 5

turns:
  - say: "Hi, my customer code is P994E — show me my last 3 invoices"
    expect:
      agent: BillingAgent
      contextVocabulary: [customerCode]
      # Asserted here, not only inferred from turn 3: without the write the third turn cannot
      # possibly hold, and a scenario that only notices the consequence two turns later reports
      # the wrong agent as guilty.
      contextWrites: [customerCode]
      toolsCalled: [GetInvoices]
      textNotEmpty: true

  # What the exit_agent quick reply sends. It releases the active agent so the next message goes
  # back through classification.
  - say: "We're done, thanks"
    expect:
      agent: BillingAgent
      agentCompleted: true
      quickReplies: none
      textNotEmpty: true
    judge:
      # Same wording as behaviour-conversation-closure, which tests this same behaviour.
      - "A user reading this response would understand they are being bid farewell or thanked, whatever the exact words — even if phrased in the agent's own in-character voice (e.g. a witch's turn of phrase) rather than literal 'thank you' or 'goodbye' wording."

  - say: "Now show me the details of my contract"
    expect:
      agent: ContractAgent
      contextVocabulary: [customerCode]
      # A Declared, specifically — not just any read. ContractAgent has never run before this turn,
      # so this is the one place the scenario can prove the shared variable actually hydrated instead
      # of only inferring it from the absence of a re-ask two turns downstream. Declared, not Hit:
      # the value already sits in the per-turn declaration, so the agent has no reason to call
      # GetContextVariable at all.
      contextReads: [Declared:customerCode]
      toolsCalled: [GetContractDetails]
      textNotEmpty: true
      textNotContains: ["#INT#", "context variable", "context store", "database", "session", "endpoint", "cache", "GetContextVariable", "SetContextVariable"]
    judgeNot:
      - "The response asks the user for their customer code or identifier."

id: consulting-colleague-cannot-answer
description: >-
  The consultation that comes back empty, which is the case the mechanism can actually deadlock on.
  The customer asks Billing which courier shipped the aloe line on INV-0247. It is not on the
  accounts desk's books, so the desk asks the greenhouse — and it is not on the greenhouse's either:
  Inventory keeps a catalog, stock and an order lifecycle (created/confirmed/cancelled) and carries
  no shipping information of any kind, so no tool of its own can produce the answer and no proxy
  value is close enough to pass for it.
  What the turn measures is the way out. Structurally: the colleague is asked exactly ONCE — the
  invocation list keeps repetitions on purpose, so a second consult_inventory in the same turn is an
  agent that went round again on an answer it did not like, which is the loop this scenario exists
  to catch — and the turn still delivers text, so the impasse resolves inside the turn rather than
  burning the AgentToAgent:MaxRoundsPerTurn safety net or leaving the customer with nothing.
  By judgement: exactly one proposition, that the desk says plainly it cannot tell them. Deliberately
  nothing about what it must avoid saying — that a colleague was asked, that another desk exists —
  because a judge handed a prohibition on this turn, where the agent genuinely has bad news to
  deliver and has to explain itself, is being invited to convict.
  Note what is NOT expected: the gap needs nothing from the customer, so there is nothing to ask
  them for. An agent demanding a value here would be answering a question with a question.
runs: 4
minPasses: 4

turns:
  - say: "Hi, my customer code is P994E — show me invoice INV-0247"
    expect:
      agent: BillingAgent
      toolsCalled: [GetInvoiceDetails]
      contextWrites: [customerCode]
      textNotEmpty: true

  - say: "That aloe line on it — which courier shipped it?"
    expect:
      agent: BillingAgent
      # Once and no more: this is the whole anti-loop assertion and it holds whether the colleague
      # came back empty or the agent simply disliked the answer.
      toolsCalledOnce: [consult_inventory]
      # The turn ends with something in the customer's hands. An impasse that produced no text would
      # satisfy every other assertion here and still be the failure the scenario is about.
      textNotEmpty: true
    judge:
      - "The response says it cannot tell the customer which courier shipped that line."

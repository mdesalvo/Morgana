id: context-cycle-on-miss
description: >-
  The full context cycle when the variable is not there yet: the agent calls its tool, the framework
  finds no customer code and keeps the tool from running, the agent asks in bare prose and the code
  the user types is passed to the tool, stored and used. This is the load-bearing scenario of the
  whole suite — if it regresses, context handling has regressed.
runs: 5
minPasses: 5

turns:
  - say: "Hi, I'd like to see my last 3 invoices"
    expect:
      agent: BillingAgent
      agentCompleted: false
      # The tool comes first: asking the user before the framework has reported the value missing
      # is the regression.
      toolsCalledFirst: [GetInvoices]
      contextReads: [Miss:customerCode]
      noContextWrites: true
      # Awaiting an operand the user must type: no buttons, no escape options.
      quickReplies: none
      richCard: absent
      textNotEmpty: true
      textNotContains: ["#INT#", "context variable", "context store", "database", "session", "endpoint", "cache"]
    judge:
      - "The response asks the user for an identifier or customer code."
    judgeNot:
      - "The response lists predefined options for the user to pick from."

  - say: "P994E"
    expect:
      agent: BillingAgent
      contextWrites: [customerCode]
      toolsCalled: [GetInvoices]
      richCard: present
      textNotEmpty: true
      textNotContains: ["#INT#", "context variable", "context store", "database", "session", "endpoint", "cache"]

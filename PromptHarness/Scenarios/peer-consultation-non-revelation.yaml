id: peer-consultation-non-revelation
description: >-
  An agent answers with something only a colleague's books hold, and the user never learns a
  colleague was asked. ContractAgent declares [ConsultsAgent("billing")] and has no tool of its own
  for payments, so the question can only be answered by consulting Billing — which makes the tool
  call the proof that the consultation happened, and the judge the proof that it stayed invisible.
  The second judgeNot was reworded after a live run: as first written it asked whether the offered
  choices read as 'handed over from somewhere else', which the judge cannot see — it reads the final
  text alone — so it fired on an ordinary row of quick replies. What is visible, and what the rule
  actually protects, is the wording of an option that names another desk or acts for someone else.
runs: 5
minPasses: 5

turns:
  # Opened on a pure contract request so classification is unambiguous: the payment question below
  # is a follow-up to the active agent and never reaches the classifier at all.
  - say: "Hi, my customer code is P994E — summarize my Green Care Plan"
    expect:
      agent: ContractAgent
      contextWrites: [customerCode]
      textNotEmpty: true

  - say: "And has its fee been invoiced to me yet?"
    expect:
      agent: ContractAgent
      # The colleague is a tool like any other from the caller's side, which is what makes the
      # consultation structurally observable rather than only inferable from the wording.
      toolsCalled: [consult_billing]
      textNotEmpty: true
      textNotContains: ["colleague", "billing agent", "consult", "another agent", "my colleague"]
    judge:
      - "The response tells the user something about whether the care plan's fee has been invoiced or paid — it does not merely promise to find out."
    judgeNot:
      - "The response says or implies that the assistant asked, checked with, forwarded to, or waited on a colleague, another agent, another department, another desk or another system."
      - "One of the offered choices names another department, desk, agent or system, or is phrased as an action for someone other than the assistant to carry out."
      - "The response points the user at another desk, office, department, bench, book or system, or asks them to take the question anywhere other than to the assistant."

id: peer-consultation-billing-asks-inventory
description: >-
  The accounts desk answers a question whose answer is on the greenhouse's books. BillingAgent
  declares [ConsultsAgent("inventory")] and has no order tool of its own, so what an invoice line's
  orderId actually bought can only come from Inventory — the consult_inventory call is the proof
  the desk asked instead of refusing, and the judge the proof it answered as its own word.
runs: 5
minPasses: 5

turns:
  # A plain billing request first, so classification is unambiguous and the follow-up below reaches
  # the active agent rather than the classifier.
  - say: "Hi, my customer code is P994E — show me invoice INV-0247"
    expect:
      agent: BillingAgent
      toolsCalled: [GetInvoiceDetails]
      contextWrites: [customerCode]
      textNotEmpty: true

  - say: "That aloe line on it — what was actually in that order, and did it go through?"
    expect:
      agent: BillingAgent
      # The colleague is a tool like any other from the caller's side, which is what makes the
      # consultation structurally observable rather than only inferable from the wording.
      toolsCalled: [consult_inventory]
      textNotEmpty: true
      textNotContains: ["colleague", "inventory agent", "consult", "another agent", "my colleague"]
    judge:
      # One positive proposition, and it is the one thing the consultation exists to produce. Every
      # other clause the framework binds here is a prohibition, so it is asserted as such below
      # rather than as a "does not" inside the positive list, which asks the judge to read a double
      # negative and is exactly where a verdict starts depending on how the line is parsed.
      - "The response names at least one concrete fact about the order behind that invoice line: a plant, a quantity, a status or a date."
    judgeNot:
      # These three are the PeerConsultation policy's own prohibitions, one proposition each: the
      # exchange leaves no trace, the user is sent nowhere, and an incomplete answer is the asking
      # agent's to own rather than a limitation handed to the user. Nothing here is established from
      # the user in this scenario — the customer code is held and the order is on the greenhouse's
      # books — so any demand for a further value is the regression, not a legitimate question.
      - "The response says or implies that the assistant asked, checked with, forwarded to, or waited on a colleague, another agent, another department, another desk or another system."
      - "The response names another desk, office, department or system as the place that holds the answer."
      - "The response tells the user to take this question somewhere else."
      - "The response asks the user for a code, a seal word or a confirmation before it will say what the order held."
      - "The response says the order could not be looked up."

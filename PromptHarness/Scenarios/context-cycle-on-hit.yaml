id: context-cycle-on-hit
description: >-
  The other half of the cycle: once a context variable is known, the agent calls its tool and does
  not ask again. Hesitation here is as much a regression as a re-ask.
runs: 5
minPasses: 5

turns:
  - say: "Hi, my customer code is P994E — show me my last 3 invoices"
    expect:
      agent: BillingAgent
      contextWrites: [customerCode]
      toolsCalled: [GetInvoices]
      textNotEmpty: true

  - say: "Now show me my payment history for the last 6 months"
    expect:
      agent: BillingAgent
      # No read is asserted: the code sits in this agent's own history, so passing it again is as
      # lawful as leaving it to the session. What may not happen is asking for it.
      toolsCalled: [GetPaymentHistory]
      textNotEmpty: true
      textNotContains: ["#INT#", "context variable", "context store", "database", "session", "endpoint", "cache"]
    judgeNot:
      - "The response asks the user for their customer code, identifier or any information the user already provided earlier in the conversation."

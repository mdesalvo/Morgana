id: behaviour-landing-asks-for-the-plant
description: >-
  The landing on InventoryAgent, an agent of the Efficiency tier, and a menu entry whose tool needs a
  value only the user can give. The press of Morgana's button must produce a presentation in words,
  not a closure looking for text it never wrote. The press of "A specific plant or flower" leads to
  CheckStockLevel, whose sku the user has not named yet: the agent asks which plant, and never lays
  the catalogue out in its place, since browsing the catalogue is an entry of its own.

turns:
  - press: inventory
    expect:
      agent: InventoryAgent
      classified: false
      toolsNotCalled: [GetProductCatalog, CheckStockLevel]
      quickReplyLabels:
        - "🌿 Browse the catalog"
        - "🌼 A specific plant or flower"
        - "🛒 Place an order"
        - "📦 My orders"
        - "📍 An order's status"
        - "💬 Ask me something else"
        - "✨ We're done, thanks"
      richCard: absent
      textNotEmpty: true
    judge:
      - "The response tells the user what can be done for them about plants or orders."

  - press: CheckStockLevel
    expect:
      agent: InventoryAgent
      # The plant is the user's to name: neither the catalogue nor a guessed SKU stands in for it.
      toolsNotCalled: [GetProductCatalog, CheckStockLevel]
      richCard: absent
      textNotEmpty: true
    judge:
      - "The response asks the user which plant they mean."

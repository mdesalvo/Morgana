id: behaviour-no-hand-off
description: >-
  There is one Morgana, and she hands nobody off. The rule lives in MandatoryTextualResponse and
  binds every agent, so it is measured here on an agent that has no colleague of its own to reach:
  InventoryAgent declares no [ConsultsAgent], so its tool list holds not one consult_ function, and
  what it cannot answer it cannot ask anybody for either. That is the case the rule exists for — an
  agent with nowhere to turn is the one tempted to send the customer away instead — and the question
  chosen is answerable at another desk of this very shop, which is the temptation itself.
  MonkeyAgent would be the purer subject, being outside the A2A topology at both ends and therefore
  never even reading the PeerConsultation policy, but its toolkit comes from a live MCP server: a
  scenario that fails because a server is down measures the rig, not the prompt. The greenhouse
  ledger is local SQLite and always there.

# Three runs rather than five, for the same reason the catalog-routing scenario takes three: both
# turns land on InventoryAgent and are billed at Performance. Three of three, not two: a boundary
# that holds twice out of three times is not a boundary.
runs: 3
minPasses: 3

turns:
  # Opened in the ledger's own domain so classification is unambiguous, and with the customer code
  # given outright: the second turn must fail for the reason under test, never because the agent was
  # busy asking who is speaking.
  - say: "Hi, my customer code is P994E — what have you got in the catalog?"
    expect:
      agent: InventoryAgent
      toolsCalled: [GetProductCatalog]
      # Stated as a precondition rather than left to luck: the second turn only measures anything if
      # the agent is still in service when it arrives, rather than being reclassified into Billing.
      # Asserting the flag rather than the shape of the turn keeps this line out of the quick-reply
      # doctrine's business, and makes a broken precondition fail HERE, legibly.
      agentCompleted: false
      textNotEmpty: true

  # Squarely off the greenhouse's books, and squarely inside the shop: another desk does hold this
  # answer, the agent's own prose says the book is not its to read, and it has no colleague to ask.
  - say: "ok and how much do I still owe on my account? I'd like to settle up"
    expect:
      agent: InventoryAgent
      textNotEmpty: true
      # Deterministic half: the agent may not name the machinery it would be handing over to. The
      # judge covers the rest, because a hand-off is expressible without any of these words.
      textNotContains: ["billing agent", "accounts desk", "another agent", "colleague", "department"]
    judge:
      # One positive claim: the refusal is honest and useful. Nothing here demands a particular
      # wording — an in-character "that is not written in the greenhouse ledger" satisfies it exactly
      # as a plain sentence does.
      - "The response makes clear the assistant does not have that information itself, and says what it can help with instead."
    judgeNot:
      # The rule itself, in the only two shapes it can be broken: naming whose books hold the answer,
      # and sending the user to them. Both are visible in the reply alone, which is all the judge
      # sees. Inviting the user to ask the assistant itself is not a hand-off and trips neither.
      - "The response points the user at another desk, office, department, colleague, book or system, or asks them to take the question anywhere other than to the assistant."
      - "The response states or implies whose records or which part of the business holds the answer."
      # Grounding, and the failure mode a refusal degrades into once it starts improvising: no
      # balance is on this agent's books, so any figure it gives for one is invented.
      - "The response states an amount owed, an invoice total or any other figure about what the user owes."

id: behaviour-landing-only-on-a-press
description: >-
  An agent presents itself only when the user pressed one of Morgana's buttons, never on text. A
  concrete first message is classified and served at once. Asking the same agent for something else
  is a short invitation, since only a landing asks the agent to introduce itself. After the farewell the
  very words of a welcome button, typed rather than pressed, are classified like any other message:
  Morgana's last line is the farewell and carries no button to press.

turns:
  # A single invoice leaves no choice of which one to open, so the turn ends on the menu and the way out.
  - say: "Hi, my customer code is P994E — show me my most recent invoice"
    expect:
      agent: BillingAgent
      classified: true
      toolsCalled: [GetInvoices]
      textNotEmpty: true

  # Asking for something else is typed: the agent invites the request and introduces nothing.
  - say: "I want to ask you something else"
    expect:
      agent: BillingAgent
      agentCompleted: false
      richCard: absent
      textNotEmpty: true
    judge:
      - "The response asks the user what they would like."

  # The farewell is typed rather than pressed.
  - say: "We're done, thanks"
    expect:
      agent: BillingAgent
      agentCompleted: true
      textNotEmpty: true

  - say: "What can you do with my invoices?"
    expect:
      agent: BillingAgent
      # Typed after the farewell, the button's words are a message like any other.
      classified: true
      textNotEmpty: true

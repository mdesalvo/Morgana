id: behaviour-order-confirmation-bills-invoice
description: >-
  Placing an order runs InventoryAgent's PlaceOrder workflow: the quote is its first step, the
  confirmation or the cancellation its second. Confirming is dispositive twice over: it decrements
  stock AND bills the customer through the shared backoffice path
  (GreenhouseDatabaseHelper.BillCustomerAsync), atomically with the confirmation itself. Guards that
  the customer confirms ONCE and that the agent then says the order was billed. Pressing the confirm
  action that the quote offered is already the approval of ConfirmOrder and the framework binds the
  orderId and the seal word from the quote, so nothing is typed and no approval buttons follow. Uses SEED-400 (500 units seeded) so five replays never run the SKU out of stock within one
  harness session. InventoryTool.GenerateSealWord() is pinned for the run to
  Harness:DeterministicSealWord (appsettings.Harness.json, default "534LW03D"), which is what lets
  the first turn assert the seal word on the card. The invoice judgeNot forbids reading the invoice's
  money out, never naming it: the Confirmed card that the agent's Formatting prescribes carries the
  orderId, the remaining stock and the invoiceId, none of which is a total, a tax or a charge line.
  The judge reads the card's rendered content along with the text.

turns:
  - say: "Hi, I'd like to order 1 pack of the wildflower seed mix, my customer code is T780C"
    expect:
      agent: InventoryAgent
      agentCompleted: false
      toolsCalled: [LaunchWorkflow, CreatePurchaseOrder]
      toolsNotCalled: [ConfirmOrder]
      textNotEmpty: true
      # Structural, not judged: the seal word is delivered on the quote's card and this asserts the
      # exact value reached the customer. Deterministic only because Harness:DeterministicSealWord
      # pins InventoryTool.GenerateSealWord() to "534LW03D" for this run.
      richCard: present
      richCardContains: ["534LW03D"]
      # The quote leaves the workflow at its choice step, whose buttons the framework proposes in the
      # step's order: structural, so nothing is left to a judge.
      quickReplyIds: ["ConfirmOrder#1", "CancelOrder#2"]

  # The confirm action that the quote offered, pressed: its value is the model's own, so it is sent as offered.
  - press: ConfirmOrder
    expect:
      agent: InventoryAgent
      toolsCalled: [ConfirmOrder]
      # Pressing the action was the approval: no second confirmation is asked.
      noQuickReplyIds: [approve_action, reject_action]
      textNotEmpty: true
      textNotContains: ["#INT#", "invoiceId", "InvoiceLines"]
    judge:
      - "The response confirms the order is now settled or binding."
      - "The response says the purchase has been billed to the customer."
    judgeNot:
      # Judged against everything the customer sees, card included. Naming the invoice is allowed and
      # required; reading its money out is what this forbids, wherever it would be rendered.
      - "The response gives the invoice's own total, its tax, or a line on it."

id: behaviour-order-confirmation-bills-invoice
description: >-
  Confirming an order is dispositive twice over: it decrements stock AND bills the customer through
  the shared backoffice path (GreenhouseDatabaseHelper.BillCustomerAsync), atomically with the
  confirmation itself. Guards that InventoryAgent actually tells the customer this happened and
  points them back to Morgana for the invoice, rather than treating ConfirmOrder as a stock-only
  event. Uses SEED-400 (500 units seeded) so five replays never run the SKU out of stock within one
  harness session. The seal word CANNOT be scripted as the random value a real conversation would
  receive — the harness DSL has no way to capture a value the model invents in one turn and replay
  it in a later turn's fixed text — so InventoryTool.GenerateSealWord() is pinned for the run to
  Harness:DeterministicSealWord (appsettings.Harness.json, default "534LW03D"); see both members'
  own remarks. Depends on that default staying "534LW03D" — if it is ever overridden, this
  scenario's say: text needs the same literal.
  Three turns, not two: even when the customer supplies the seal word AND an explicit "yes" in the
  very same message, InventoryAgent's own doctrine (step 5 of the numbered process in its
  Instructions — restate binding effect, wait for a SEPARATE explicit yes) still holds one more
  round before calling ConfirmOrder. Confirmed live: a two-turn version of this scenario failed 0/5,
  the agent asking "Shall I proceed?" every single run rather than treating the front-loaded seal
  word as sufficient. That is correct behaviour, not a bug — the scenario is written to match it.

  The invoice judgeNot was reworded after a live run: 'a specific invoice total, amount or line item'
  fired on the remaining stock and the invoiceId that this agent's own Formatting REQUIRES on the
  Confirmed card, so the judge and the prose were asking for opposite things. What the rule protects
  is that the greenhouse never reads the invoice out — its money, not its existence. That rule now
  covers more ground than when it was written and deliberately so: the judge reads the card's
  rendered content along with the text, so an agent that keeps its prose clean and puts the invoice's
  total on a card no longer slips past. The wording holds unchanged under the wider view — the
  Confirmed card this Formatting prescribes carries orderId, remaining stock and invoiceId. None
  of those is a total, a tax or a charge line.

turns:
  - say: "Hi, I'd like to order 1 pack of the wildflower seed mix, my customer code is T780C"
    expect:
      agent: InventoryAgent
      agentCompleted: false
      toolsCalled: [CreatePurchaseOrder]
      toolsNotCalled: [ConfirmOrder]
      textNotEmpty: true
      # Structural, not judged: the seal word is customarily delivered inside the order's own rich
      # card (a key_value component), never spelled out in prose — the agent's flowery persona text
      # only alludes to it ("keep that seal word safe"). A literal is a structural matter regardless
      # of who else can see it: this asserts the exact value reached the customer, which no
      # proposition should be asked to do. It is deterministic only because Harness:DeterministicSealWord
      # pins InventoryTool.GenerateSealWord() to "534LW03D" for this run.
      richCard: present
      richCardContains: ["534LW03D"]
    judge:
      - "The response asks the customer to confirm before the order becomes binding."

  - say: "Yes, please confirm it. The seal word is 534LW03D"
    expect:
      agent: InventoryAgent
      agentCompleted: false
      toolsCalled: [GetOrderStatus]
      toolsNotCalled: [ConfirmOrder]
      textNotEmpty: true
    judge:
      - "The response says that confirming is binding: the stock will be committed, or the order cannot easily be undone afterwards."
      - "The response asks the customer for a final go-ahead."
    judgeNot:
      - "The response claims the order is already confirmed or billed."

  - say: "Yes, proceed"
    expect:
      agent: InventoryAgent
      toolsCalled: [ConfirmOrder]
      textNotEmpty: true
      textNotContains: ["#INT#", "invoiceId", "InvoiceLines"]
    judge:
      - "The response confirms the order is now settled or binding."
      - "The response says the purchase has been billed to the customer."
      - "The response tells the customer that invoice can be seen if they wish."
    judgeNot:
      # Judged against everything the customer sees, card included. Naming the invoice is allowed and
      # required; reading its money out is what this forbids, wherever it would be rendered.
      - "The response gives the invoice's own total, its tax, or a line on it."

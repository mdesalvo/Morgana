id: classifier-routes-unambiguous-billing-request
description: >-
  An unambiguous request lands the classifier on the right intent, and the router sends it to the
  agent that intent maps to — the classifier's own output asserted directly, not inferred from which
  agent happened to answer.

turns:
  - say: "I'd like to check my last invoice, please."
    expect:
      agent: BillingAgent
      classifierIntent: billing
      textNotEmpty: true
